name: Deploy frontend to GitHub Pages

# Builds the React client and publishes it to GitHub Pages.
# The proxy server is NOT deployed here (Pages is static only) — host it
# separately (Render/Railway/Cloudflare) and point the app at it via the ⚙
# Settings dialog, or set the VITE_PROXY_URL repo variable below.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build client
        env:
          # Optional: set a repo variable named VITE_PROXY_URL to bake in the proxy URL.
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
