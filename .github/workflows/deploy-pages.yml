name: Deploy frontend to GitHub Pages

# Builds the React client and publishes it to GitHub Pages.
#
# DISABLED on push by default: GitHub Pages is not available for PRIVATE repos
# on free plans, so an automatic run fails at the "configure-pages" step. This
# workflow is therefore manual-only (Run workflow button). Enable Pages first
# (repo public OR paid plan) → Settings ▸ Pages ▸ Source: GitHub Actions, then
# trigger it manually. The proxy is NOT deployed here (Pages is static only) —
# host it separately and point the app at it via the ⚙ Settings dialog.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build client
        env:
          # Optional: set a repo variable named VITE_PROXY_URL to bake in the proxy URL.
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
